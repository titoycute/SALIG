<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALIG | Loading...</title>
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen">

    <div class="text-center flex flex-col items-center">
        <!-- Logo constrained to 120px height -->
        <img src="logo.png" alt="SALIG Logo" class="h-32 w-auto mb-4 animate-pulse">
        <h1 class="text-3xl font-black text-slate-800 tracking-tighter"></h1>
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">Savings Alliance for Liquidity, Investment, and Growth</p>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'admin') {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "manager.html";
                }
            } else {
                window.location.href = "login.html";
            }
        });

    </script>
</body>
</html>
